<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월록 — 답변하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height:100%; background:#E8E3DC; }
    body {
      min-height:100%;
      background:linear-gradient(165deg,#F7F4EF 0%,#EDE8E1 40%,#E8E3DC 100%);
      color:#1A1814;
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      font-weight:300;
      display:flex; align-items:center; justify-content:center;
      padding:48px 20px;
      line-height:1.7;
    }
    .container { width:100%; max-width:460px; animation:fadeUp .6s ease-out; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .logo-wrap { text-align:center; margin-bottom:44px; }
    .logo-ko {
      display:block;
      font-family:'Noto Serif KR',serif;
      font-size:20px; font-weight:400; color:#1A1814;
      letter-spacing:4px;
    }
    .logo-en {
      display:block; margin-top:4px;
      font-size:10px; font-weight:300; color:#B5B0AB;
      letter-spacing:5px;
    }

    /* 질문 카드 */
    .card {
      background:rgba(255,255,255,0.75);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.6);
      box-shadow:0 4px 24px rgba(0,0,0,0.04);
      padding:36px 32px 40px;
      margin-bottom:8px;
    }

    .meta {
      font-size:13px; color:#B5B0AB; margin-bottom:28px; letter-spacing:0.3px;
    }
    .question {
      font-family:'Noto Serif KR',serif;
      font-size:24px; font-weight:400; line-height:1.6;
      color:#1A1814; margin-bottom:0;
    }

    /* 답변 카드 */
    .answer-card {
      background:rgba(255,255,255,0.75);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.6);
      box-shadow:0 4px 24px rgba(0,0,0,0.04);
      padding:28px 24px 30px;
      margin-bottom:8px;
    }

    .answer-area {
      width:100%; min-height:120px; padding:0; font-size:15px;
      font-family:inherit; font-weight:300; line-height:1.8;
      border:none; background:transparent; color:#1A1814;
      outline:none; resize:none;
    }
    .answer-area::placeholder { color:#CCC8C3; }
    .answer-meta {
      display:flex; justify-content:space-between; align-items:center;
      margin-top:16px; padding-top:16px;
      border-top:1px solid rgba(0,0,0,0.04);
    }
    .char-count { font-size:12px; color:#CCC8C3; }

    .btn {
      width:100%; padding:16px;
      font-size:14px; font-family:inherit; font-weight:400;
      background:#1A1814; color:#fff;
      border:none; border-radius:12px; cursor:pointer;
      letter-spacing:0.3px;
      box-shadow:0 2px 12px rgba(26,24,20,0.12);
      transition:opacity .2s;
    }
    .btn:hover { opacity:.85; }
    .btn:disabled { opacity:.4; cursor:default; }

    .message { margin-top:16px; padding:16px 20px; border-radius:12px; font-size:14px; line-height:1.8; display:none; }
    .message.success { display:block; background:rgba(58,125,92,0.08); color:#3A7D5C; }
    .message.error { display:block; background:rgba(199,80,80,0.08); color:#C75050; }

    /* 기존 답변 카드 */
    .existing-card {
      background:rgba(255,255,255,0.5);
      -webkit-backdrop-filter:blur(16px);
      backdrop-filter:blur(16px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.4);
      box-shadow:0 2px 16px rgba(0,0,0,0.03);
      padding:24px 24px 26px;
      margin-bottom:8px;
      display:none;
    }
    .existing-label { font-size:12px; color:#B5B0AB; margin-bottom:10px; letter-spacing:0.3px; }
    .existing-answer { font-size:15px; line-height:1.7; color:#4A4540; margin-bottom:14px; }
    .edit-link {
      display:inline-block; font-size:13px; color:#9A9590;
      cursor:pointer; text-decoration:underline;
      text-underline-offset:3px;
    }

    /* 푸터 */
    .footer { margin-top:36px; text-align:center; }
    .footer-links { margin-bottom:12px; }
    .footer-links a {
      font-size:13px; color:#9A9590; text-decoration:none;
      padding:0 16px;
    }
    .footer-links .dot { color:#DDD8D3; font-size:8px; }

    /* 확인 모달 */
    .confirm-overlay {
      display:none; position:fixed; top:0; left:0;
      width:100%; height:100%;
      background:rgba(26,24,20,0.35);
      -webkit-backdrop-filter:blur(4px);
      backdrop-filter:blur(4px);
      z-index:100; align-items:center; justify-content:center;
    }
    .confirm-overlay.show { display:flex; }
    .confirm-box {
      background:rgba(255,255,255,0.92);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.6);
      box-shadow:0 8px 32px rgba(0,0,0,0.08);
      padding:32px 28px; max-width:320px; width:90%; text-align:center;
    }
    .confirm-box p { font-size:15px; line-height:1.7; margin-bottom:24px; color:#1A1814; }
    .confirm-box .btn-row { display:flex; gap:10px; }
    .confirm-box .btn-cancel {
      flex:1; padding:14px; font-size:14px; font-family:inherit;
      background:rgba(0,0,0,0.04); color:#9A9590;
      border:none; border-radius:12px; cursor:pointer;
    }
    .confirm-box .btn-confirm {
      flex:1; padding:14px; font-size:14px; font-family:inherit;
      background:#1A1814; color:#fff;
      border:none; border-radius:12px; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <span class="logo-ko">월록</span>
      <span class="logo-en">WOLLOG</span>
    </div>

    <!-- 질문 카드 -->
    <div class="card">
      <div class="meta" id="metaInfo"></div>
      <h1 class="question" id="questionText"></h1>
    </div>

    <!-- 기존 답변 -->
    <div class="existing-card" id="existingBox">
      <div class="existing-label">이미 남긴 답변이 있어요</div>
      <div class="existing-answer" id="prevAnswer"></div>
      <span class="edit-link" onclick="enableEdit()">다시 쓸래요</span>
    </div>

    <!-- 답변 입력 카드 -->
    <div class="answer-card" id="answerSection">
      <textarea class="answer-area" id="answer" placeholder="여기에 적어주세요" maxlength="200"></textarea>
      <div class="answer-meta">
        <span></span>
        <span class="char-count"><span id="charNum">0</span> / 200</span>
      </div>
    </div>

    <button class="btn" id="submitBtn" onclick="handleSubmit()">답변 남기기</button>
    <div id="msg" class="message"></div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" onclick="shareLink(event)">공유하기</a>
        <span class="dot">●</span>
        <a href="https://www.instagram.com/wollog.official" target="_blank">인스타그램</a>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p>이전 답변을 덮어쓸까요?<br>되돌릴 수 없어요.</p>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeConfirm()">취소</button>
        <button class="btn-confirm" onclick="confirmSubmit()">덮어쓰기</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbzGJcIlPRRVqdUBP1MBC6L6ky15HCIYyH-oKwkw2BaO3C7LWtQmg7rPU2BSDLcMwHnFKg/exec';
    const params=new URLSearchParams(window.location.search);
    const uid=params.get('uid')||'';
    const q=params.get('q')||'';
    const cycle=params.get('cycle')||'';
    const questions={
      'Q01':'요즘 자꾸 재생하게 되는 노래는?',
      'Q02':'요즘 이 계절을 만끽하기 위해 한 가지 하고 있는 것은?',
      'Q03':'요즘 자꾸 가고 싶어지는 곳은?',
      'Q04':'요즘 자꾸 생각나는 사람이나 장면은?',
      'Q05':'요즘 자꾸 미루고 있는 것은?',
      'Q06':'요즘 듣고 싶은 말은?',
      'Q07':'요즘 내가 가장 잘 하고 있는 것은?',
      'Q08':'요즘 나를 가장 흔드는 것은?',
      'Q09':'요즘 가장 좋아하는 시간대는?',
      'Q10':'이번 달의 나를 한 단어로 표현하면?',
    };
    const qNum=parseInt((q||'Q0').replace('Q',''));
    const dateParam=params.get('date')||'';
    const today=new Date();
    const monthNum=today.getMonth()+1;
    const dateStr=dateParam||(today.getFullYear()+'년 '+monthNum+'월 '+today.getDate()+'일');
    document.getElementById('metaInfo').textContent=dateStr+'  ·  '+monthNum+'월의 '+qNum+'번째 질문';
    document.getElementById('questionText').textContent='Q. '+(questions[q]||'질문을 불러올 수 없어요.');

    const answerEl=document.getElementById('answer');
    answerEl.addEventListener('input',function(){document.getElementById('charNum').textContent=this.value.length;});

    let hasExisting=false;
    async function checkExisting(){
      if(!uid||!q||!cycle)return;
      try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'check',email:uid,q:q,cycle:cycle})});
        const data=await res.json();
        if(data.success&&data.exists){
          hasExisting=true;
          document.getElementById('prevAnswer').textContent=data.answer;
          document.getElementById('existingBox').style.display='block';
          document.getElementById('answerSection').style.display='none';
          document.getElementById('submitBtn').style.display='none';
        }
      }catch(e){}
    }
    checkExisting();

    function enableEdit(){
      document.getElementById('existingBox').style.display='none';
      document.getElementById('answerSection').style.display='block';
      document.getElementById('submitBtn').style.display='block';
      answerEl.focus();
    }
    function handleSubmit(){
      const answer=answerEl.value.trim();
      const msg=document.getElementById('msg');
      if(!answer){msg.textContent='답변을 입력해주세요.';msg.className='message error';return;}
      if(!uid||!q||!cycle){msg.textContent='잘못된 접근이에요. 메일의 링크를 통해 접속해주세요.';msg.className='message error';return;}
      if(hasExisting){document.getElementById('confirmOverlay').className='confirm-overlay show';return;}
      doSubmit();
    }
    function closeConfirm(){document.getElementById('confirmOverlay').className='confirm-overlay';}
    function confirmSubmit(){closeConfirm();doSubmit();}
    async function doSubmit(){
      const answer=answerEl.value.trim();
      const btn=document.getElementById('submitBtn');
      const msg=document.getElementById('msg');
      btn.disabled=true;btn.textContent='보내는 중...';msg.className='message';msg.style.display='none';
      try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'answer',email:uid,q:q,answer:answer,cycle:cycle})});
        const data=await res.json();
        if(data.success){
          document.querySelector('.card').style.display='none';
          document.querySelector('.answer-card').style.display='none';
          document.getElementById('existingBox').style.display='none';
          document.getElementById('submitBtn').style.display='none';
          msg.className='message';msg.style.display='none';
          const done=document.createElement('div');
          done.style.cssText='animation:fadeUp .5s ease-out;';
          done.innerHTML='<div style="background:rgba(255,255,255,0.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,0.6);box-shadow:0 4px 24px rgba(0,0,0,0.04);padding:48px 32px;text-align:center;">'
            +'<div style="font-family:\'Noto Serif KR\',serif;font-size:26px;font-weight:400;color:#1A1814;line-height:1.6;margin-bottom:20px;">답변이 기록됐어요.</div>'
            +'<div style="font-size:15px;color:#6B655D;line-height:2;">'
            +'다음 달 같은 질문과 함께<br>오늘의 답변을 다시 보내드려요.'
            +'</div>'
            +'</div>';
          const footer=document.querySelector('.footer');
          document.querySelector('.container').insertBefore(done,footer);
        }
        else{msg.textContent=data.message;msg.className='message error';btn.disabled=false;btn.textContent='답변 남기기';}
      }catch(err){msg.textContent='오류가 발생했어요. 다시 시도해주세요.';msg.className='message error';btn.disabled=false;btn.textContent='답변 남기기';}
    }
    function shareLink(e){
      e.preventDefault();
      var url=window.location.origin;
      if(navigator.share){navigator.share({title:'월록',text:'매달 같은 질문, 달라지는 나의 답변.',url:url});}
      else{navigator.clipboard.writeText(url).then(function(){alert('링크가 복사됐어요!');});}
    }
  </script>
</body>
</html>
