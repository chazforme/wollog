<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월록 — 매달 나를 기록하는 시간</title>
  <meta name="description" content="매달 같은 10개의 질문이 메일로 와요. 답이 쌓일수록 달라진 내가 보여요. 월·수·금 오전 8시, 무료로 시작하세요.">
  <meta property="og:title" content="월록 — 매달 나를 기록하는 시간">
  <meta property="og:description" content="매달 같은 10개의 질문이 메일로 와요. 답이 쌓일수록 달라진 내가 보여요.">
  <meta property="og:url" content="https://wollog.co.kr">
  <meta property="og:type" content="website">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height:100%; background:#E8E3DC; }
    body {
      min-height:100%;
      background:linear-gradient(165deg,#F7F4EF 0%,#EDE8E1 40%,#E8E3DC 100%);
      color:#1A1814;
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      font-weight:300;
      display:flex; align-items:center; justify-content:center;
      padding:48px 20px;
      line-height:1.7;
    }
    .container { width:100%; max-width:460px; animation:fadeUp .6s ease-out; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .logo-wrap { text-align:center; margin-bottom:44px; }
    .logo-ko {
      display:block;
      font-family:'Noto Serif KR',serif;
      font-size:20px; font-weight:400; color:#1A1814;
      letter-spacing:4px;
    }
    .logo-en {
      display:block; margin-top:4px;
      font-size:10px; font-weight:300; color:#B5B0AB;
      letter-spacing:5px;
    }

    /* 메인 카드 */
    .card {
      background:rgba(255,255,255,0.75);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.6);
      box-shadow:0 4px 24px rgba(0,0,0,0.04);
      padding:36px 32px 40px;
      margin-bottom:8px;
    }

    .headline {
      font-family:'Noto Serif KR',serif;
      font-size:24px; font-weight:400; line-height:1.6;
      margin-bottom:14px; color:#1A1814;
    }
    .subtitle {
      font-size:14px; color:#9A9590; line-height:1.9; margin-bottom:36px;
    }

    .field { margin-bottom:20px; }
    .field label { display:block; font-size:12px; color:#B5B0AB; margin-bottom:8px; letter-spacing:0.3px; }
    .field input {
      width:100%; padding:14px 0; font-size:16px;
      font-family:inherit; font-weight:300;
      border:none; border-bottom:1px solid #E8E4DF;
      background:transparent; color:#1A1814; outline:none;
      transition:border-color .2s;
    }
    .field input:focus { border-bottom-color:#1A1814; }
    .field input::placeholder { color:#CCC8C3; }
    .field select {
      width:100%; padding:14px 0; font-size:16px;
      font-family:inherit; font-weight:300;
      border:none; border-bottom:1px solid #E8E4DF;
      background:transparent; color:#1A1814; outline:none;
      cursor:pointer; appearance:none;
      transition:border-color .2s;
    }
    .field select:focus { border-bottom-color:#1A1814; }
    .field select option { color:#1A1814; }
    .field select.placeholder { color:#CCC8C3; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

    .btn {
      width:100%; margin-top:32px; padding:16px;
      font-size:14px; font-family:inherit; font-weight:400;
      background:#1A1814; color:#fff;
      border:none; border-radius:12px; cursor:pointer;
      letter-spacing:0.3px;
      box-shadow:0 2px 12px rgba(26,24,20,0.12);
      transition:opacity .2s;
    }
    .btn:hover { opacity:.85; }
    .btn:disabled { opacity:.4; cursor:default; }

    .message { margin-top:20px; padding:16px 20px; border-radius:12px; font-size:14px; line-height:1.8; display:none; }
    .message.success { display:block; background:rgba(58,125,92,0.08); color:#3A7D5C; }
    .message.error { display:block; background:rgba(199,80,80,0.08); color:#C75050; }
    .message.info { display:block; background:rgba(180,150,90,0.08); color:#8A6F3E; }

    /* 안내 카드 */
    .info-card {
      background:rgba(255,255,255,0.4);
      -webkit-backdrop-filter:blur(16px);
      backdrop-filter:blur(16px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.3);
      box-shadow:0 2px 16px rgba(0,0,0,0.02);
      padding:28px 24px;
      text-align:center;
    }
    .info-card .info-main {
      font-size:14px; color:#9A9590; line-height:1.9; margin-bottom:8px;
    }
    .info-card .info-sub {
      font-size:12px; color:#C5C0BB;
    }

    /* 푸터 */
    .footer { margin-top:36px; text-align:center; }
    .footer-links { margin-bottom:12px; }
    .footer-links a {
      font-size:13px; color:#9A9590; text-decoration:none;
      padding:0 16px;
    }
    .footer-links .dot { color:#DDD8D3; font-size:8px; }
    .footer-sub a {
      font-size:11px; color:#CCC8C3; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <span class="logo-ko">월록</span>
      <span class="logo-en">WOLLOG</span>
    </div>

    <div class="card">
      <h1 class="headline">매달 같은 질문,<br>달라지는 나의 답변.</h1>
      <p class="subtitle">
        한 달에 10개의 질문이 메일로 도착해요.<br>
        한 달 뒤, 같은 질문과 함께 지난 내 답변을 돌려드려요.
      </p>

      <div id="formSection">
        <div class="field">
          <label>이메일</label>
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label>닉네임</label>
          <input type="text" id="nickname" placeholder="월록에서 불릴 이름" autocomplete="given-name" maxlength="20">
        </div>
        <div class="row2">
          <div class="field">
            <label>성별</label>
            <select id="gender" class="placeholder" onchange="this.classList.remove('placeholder')">
              <option value="" disabled selected>선택</option>
              <option value="여성">여성</option>
              <option value="남성">남성</option>
            </select>
          </div>
          <div class="field">
            <label>연령대</label>
            <select id="age" class="placeholder" onchange="this.classList.remove('placeholder')">
              <option value="" disabled selected>선택</option>
              <option value="10대">10대</option>
              <option value="20대">20대</option>
              <option value="30대">30대</option>
              <option value="40대">40대</option>
              <option value="50대">50대</option>
              <option value="60대 이상">60대 이상</option>
            </select>
          </div>
        </div>
        <button class="btn" id="submitBtn" onclick="handleSubmit()">시작하기</button>
      </div>

      <div id="msg" class="message"></div>
    </div>

    <div class="info-card">
      <div class="info-main">
        월·수·금 오전 8시, 질문이 도착해요.<br>
        답변은 1분이면 충분해요.
      </div>
      <div class="info-sub">답이 쌓일수록, 달라진 내가 보여요.</div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" onclick="shareLink(event)">공유하기</a>
        <span class="dot">●</span>
        <a href="https://www.instagram.com/wollog.official" target="_blank">인스타그램</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbzGJcIlPRRVqdUBP1MBC6L6ky15HCIYyH-oKwkw2BaO3C7LWtQmg7rPU2BSDLcMwHnFKg/exec';

    function getNextMailDate(){
      const today=new Date();
      const hour=today.getHours();
      const mailDays=[1,3,5];
      const dayNames=['일','월','화','수','목','금','토'];
      for(let i=0;i<=7;i++){
        const d=new Date(today);
        d.setDate(today.getDate()+i);
        if(mailDays.includes(d.getDay())){
          if(i===0&&hour>=8)continue;
          return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dayNames[d.getDay()]+')';
        }
      }
      return '가장 가까운 월·수·금';
    }

    async function handleSubmit(){
      const email=document.getElementById('email').value.trim();
      const nickname=document.getElementById('nickname').value.trim();
      const gender=document.getElementById('gender').value;
      const age=document.getElementById('age').value;
      const btn=document.getElementById('submitBtn');
      const msg=document.getElementById('msg');
      if(!email||!nickname){msg.textContent='이메일과 닉네임을 모두 입력해주세요.';msg.className='message error';return;}
      btn.disabled=true;btn.textContent='잠시만요...';msg.className='message';msg.style.display='none';
      try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'signup',email,nickname,gender,age})});
        const data=await res.json();
        if(data.success){
          const nextDate=getNextMailDate();
          document.querySelector('.card').innerHTML='<div style="text-align:center;padding:16px 0;">'
            +'<div style="font-family:\'Noto Serif KR\',serif;font-size:26px;font-weight:400;color:#1A1814;line-height:1.6;margin-bottom:20px;">가입 완료되었어요.</div>'
            +'<div style="font-size:15px;color:#6B655D;line-height:1.9;">'
            +'환영해요, '+nickname+'님!<br>'
            +'첫 번째 질문은 <strong>'+nextDate+'<br>오전 8시</strong>에 메일로 도착할 거예요.'
            +'</div></div>';
        }else if(data.message&&data.message.includes('이미 가입')){
          msg.innerHTML='이미 가입된 이메일이에요.<br><span style="font-size:13px;opacity:.8;">메일함에서 월록을 찾아보세요.</span>';
          msg.className='message info';
          btn.disabled=false;btn.textContent='시작하기';
        }else{
          msg.textContent=data.message;msg.className='message error';btn.disabled=false;btn.textContent='시작하기';
        }
      }catch(err){msg.textContent='오류가 발생했어요. 다시 시도해주세요.';msg.className='message error';btn.disabled=false;btn.textContent='시작하기';}
    }
    document.addEventListener('keydown',function(e){if(e.key==='Enter')handleSubmit();});
    function shareLink(e){
      e.preventDefault();
      const url=window.location.origin;
      if(navigator.share){navigator.share({title:'월록',text:'매달 같은 질문, 달라지는 나의 답변.',url:url});}
      else{navigator.clipboard.writeText(url).then(function(){alert('링크가 복사됐어요!');});}
    }
  </script>
</body>
</html>
